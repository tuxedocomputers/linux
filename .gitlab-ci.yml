include:
  - project: 'tuxedocomputers/development/gitlab-ci-scripts'
    ref: kernel-ci-debian-testing
    file: '/common-deploy.yml'

default:
    # Custom docker image: debian:testing with build dependencies preinstalled.
    image: registry.gitlab.com/tuxedocomputers/development/installation-testing/docker-images/linux-builder:debian-testing-latest

    before_script:
        # Configure git to be able to push.
        - git config --global user.name "Tuxedo BOT"
        - git config --global user.email "tux@tuxedocomputers.com"
        - gpg --import ${TUXEDO_BOT_GPG_PRIVATE_KEY}

        # Setup author for dch.
        - export DEBFULLNAME="Tuxedo BOT"
        - export DEBEMAIL="tux@tuxedocomputers.com"

stages:
    # The update job is not run on the same commit as the build, and deploy jobs. It's included in
    # this explicit order here purely to make the CI script more readable.
    - update
    - build
    - deploy1
    - deploy2

update:
    stage: update

    tags:
        - size:medium

    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
        - when: never

    variables:
        # Create a fresh clone every time, instead of caching the last checkout of the repository. This
        # is required for a clean slate the way the auto-update script expects.
        GIT_STRATEGY: clone

    script:
        # GitLab CI checks out in a detached head state, correct this to be able to push.
        - git checkout ${CI_COMMIT_BRANCH}

        # Run the logic determining the new version, update, and push the result.
        - ./01-tuxedo-update-repository.sh --auto

        # Push using a GitLab Personal Access Token.
        - git push --force --progress --verbose "https://${TUXEDO_BOT_GITLAB_USERNAME}:${TUXEDO_BOT_GITLAB_CI_PERSONAL_ACCESS_TOKEN}@${CI_REPOSITORY_URL#*@}" ${CI_COMMIT_BRANCH}
        - git push --force --progress --verbose "https://${TUXEDO_BOT_GITLAB_USERNAME}:${TUXEDO_BOT_GITLAB_CI_PERSONAL_ACCESS_TOKEN}@${CI_REPOSITORY_URL#*@}" $(git describe --tags --abbrev=0)

build:
    stage: build

    tags:
        - size:large

    rules:
        - if: $CI_COMMIT_TAG
        - when: never

    script:
        # Setup environment and create packages.
        - export MAKEFLAGS=-j$(nproc)
        - export DEB_BUILD_PROFILES='nodoc noudeb pkg.linux.mintools pkg.linux.nokerneldbg pkg.linux.nokerneldbginfo pkg.linux.nosource nopython'
        - uscan --download-current-version --vcs-export-uncompressed
        - make -f debian/rules orig
        - make -f debian/rules debian/control || true
        - debuild > /dev/null
        - cd ..
        - DEBIAN_FRONTEND=noninteractive apt-get -y install ./linux-image-*-unsigned_*_amd64.deb
        - git clone https://salsa.debian.org/kernel-team/kernel-team.git
        - ./kernel-team/scripts/debian-test-sign ./linux_*_amd64.changes
        - dpkg-source -x linux-signed-amd64_*.dsc
        - cd linux-signed-amd64-*
        - debuild > /dev/null

        # Copy results into build directory so that the artifacts keyword can pick them up.
        - cd "${CI_PROJECT_DIR}"
        - rm --recursive --force output
        - mkdir output
        - mv ../*.deb ../*.buildinfo ../*.changes ../*.tar.xz ../*.dsc output || true

    after_script:
        - tail --lines=1000 --verbose ../linux_*_amd64.build
        - tail --lines=1000 --verbose ../linux-signed-amd64_*_amd64.build
        - rm ../linux_*_amd64.build
        - rm ../linux-signed-amd64_*_amd64.build

    artifacts:
        # Save build results.
        paths:
            - output

deploy_to_nextcloud:
    stage: deploy1

    rules:
        - if: $CI_COMMIT_TAG
        - when: never

    variables:
        # This job does not need a clean working directory.
        GIT_STRATEGY: none

    script:
        # Get version number.
        - CURRENT_VERSION=$(dpkg-deb --field output/linux-image-tuxedo-amd64_*_amd64.deb Version)

        # Upload to new folder on internal Nextcould.
        - curl --request MKCOL ${TUXEDO_BOT_WEBDAV_LINUX_DEBIAN_TESTING_BASE_FOLDER_URL}/${CURRENT_VERSION} --user ${TUXEDO_BOT_NEXTCLOUD_USERNAME}:${TUXEDO_BOT_NEXTCLOUD_PASSWORD}
        - find output/* -exec curl --upload-file '{}' ${TUXEDO_BOT_WEBDAV_LINUX_DEBIAN_TESTING_BASE_FOLDER_URL}/${CURRENT_VERSION}/ --user ${TUXEDO_BOT_NEXTCLOUD_USERNAME}:${TUXEDO_BOT_NEXTCLOUD_PASSWORD} \;

# Needs to be called "deploy" to use the CI include from the top
deploy: # deploy_to_flat_apt_repo
    stage: deploy2

    # Overwrite "- when: never" rule from include
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - when: never

    variables:
        # This job does not need a clean working directory.
        GIT_STRATEGY: none

    before_script:
        # Get version number.
        - CURRENT_VERSION=$(dpkg-deb --field output/linux-image-tuxedo-amd64_*_amd64.deb Version)

        # Set variables for generic deploy script from CI include from the top
        - USERNAME=${FLAT_APT_REPO_UPLOAD_USER}
        - TARGETSERVER=${FLAT_APT_REPO_UPLOAD_URL}
        - TARGETDIR=${FLAT_APT_REPO_UPLOAD_PATH_DEBIAN_TESTING}/${CURRENT_VERSION}

        # Create flat apt repository meta information
        - cd output
        - mkdir upload
        - cp linux-headers-*-common-tuxedo_*_all.deb linux-headers-*-tuxedo-amd64_*_amd64.deb linux-headers-tuxedo-amd64_*_amd64.deb linux-image-*-tuxedo-amd64_*_amd64.deb linux-image-*-tuxedo-amd64-unsigned_*_amd64.deb linux-image-tuxedo-amd64_*_amd64.deb linux-kbuild-*_*_amd64.deb upload
        - cd upload
        - dpkg-scanpackages . | xz -9 > Packages.xz

    # "script:" is implemented in CI include from the top
